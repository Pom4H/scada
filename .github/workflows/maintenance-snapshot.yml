name: Apply reviewed maintenance
on:
  push:
    branches: [maintenance/lts-polish]
    paths: [.github/maintenance.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: maintenance/lts-polish
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
      - name: Apply reviewed source changes and generate lockfile
        run: |
          git apply --check --unidiff-zero .github/maintenance.patch
          git apply --unidiff-zero .github/maintenance.patch
          npm install --package-lock-only --ignore-scripts --no-fund
          npm ci --no-fund
          npm audit --audit-level=high
          npm run check
          git rm .github/maintenance.patch
          git add .nvmrc .github/dependabot.yml README.md index.html package.json package-lock.json playwright.config.ts scripts/build.mjs scripts/verify-live.mjs src/assets.d.ts src/main.ts src/source.ts src/view.ts tests/e2e/editor.spec.ts tests/e2e/maintenance.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: Node 24 LTS, current dependencies and verified renderer maintenance'
          git push origin HEAD:maintenance/lts-polish
